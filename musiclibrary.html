<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nocturne — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A1512;
    --bg-2: #0F1E19;
    --surface: #132621;
    --surface-2: #1A322B;
    --gold: #E8C368;
    --rose: #E0806B;
    --ink: #F3EFE6;
    --muted: #8FA69D;
    --hairline: rgba(243,239,230,0.09);
    --danger: #E0806B;
    --max: 1180px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  body{
    background:
      radial-gradient(900px 600px at 85% -10%, rgba(232,195,104,0.10), transparent 60%),
      radial-gradient(700px 500px at 5% 100%, rgba(224,128,107,0.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Sora', sans-serif;
    min-height:100vh;
  }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  ::selection{ background:var(--gold); color:var(--bg); }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 32px; }
  @media (max-width:640px){ .wrap{ padding:0 18px; } }

  a:focus-visible, button:focus-visible, input:focus-visible, [role="slider"]:focus-visible{
    outline:2px solid var(--gold); outline-offset:3px; border-radius:4px;
  }

  /* ===================== NAV ===================== */
  nav{ padding:28px 0; border-bottom:1px solid var(--hairline); }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic; font-size:1.7rem; letter-spacing:0.01em; }
  .logo span{ color:var(--gold); }
  .navlinks{ display:flex; gap:32px; font-size:0.85rem; color:var(--muted); }
  .navlinks a{ transition:color .2s ease; }
  .navlinks a:hover{ color:var(--ink); }
  @media (max-width:640px){ .navlinks{ display:none; } }

  main{ padding:56px 0 100px; }

  /* ===================== NOW PLAYING ===================== */
  .player{
    display:grid; grid-template-columns:340px 1fr; gap:56px;
    padding-bottom:56px; border-bottom:1px solid var(--hairline); margin-bottom:48px;
  }
  @media (max-width:900px){ .player{ grid-template-columns:1fr; gap:36px; } }

  .art-stage{ position:relative; display:flex; flex-direction:column; align-items:center; }
  .art-glow{
    position:absolute; inset:-40px; border-radius:50%;
    filter:blur(50px); opacity:0.55; z-index:0;
    transition:background 0.6s ease;
  }
  .disc{
    position:relative; z-index:1; width:280px; height:280px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.6);
    transition:background 0.6s ease;
    animation:spin 14s linear infinite; animation-play-state:paused;
  }
  .disc.spinning{ animation-play-state:running; }
  .disc::before{
    content:''; position:absolute; inset:14px; border-radius:50%;
    border:1px dashed rgba(243,239,230,0.18);
  }
  .disc-center{
    width:64px; height:64px; border-radius:50%; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(243,239,230,0.15);
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    color:var(--gold); font-size:0.95rem;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .buffer-ring{
    position:absolute; z-index:2; width:60px; height:60px; border-radius:50%;
    border:2px solid transparent; border-top-color:var(--ink); border-right-color:var(--ink);
    opacity:0; pointer-events:none; animation:buffer-spin 0.8s linear infinite;
    transition:opacity .2s ease;
  }
  .buffer-ring.active{ opacity:0.85; }
  @keyframes buffer-spin{ to{ transform:rotate(360deg); } }

  .visualizer{ display:flex; align-items:flex-end; gap:4px; height:34px; margin-top:26px; }
  .visualizer span{
    width:4px; border-radius:3px; background:linear-gradient(180deg, var(--gold), var(--rose));
    height:6px; animation:bounce 1.1s ease-in-out infinite; animation-play-state:paused;
  }
  .visualizer.playing span{ animation-play-state:running; }
  .visualizer span:nth-child(1){ animation-delay:0s; }
  .visualizer span:nth-child(2){ animation-delay:0.1s; }
  .visualizer span:nth-child(3){ animation-delay:0.2s; }
  .visualizer span:nth-child(4){ animation-delay:0.3s; }
  .visualizer span:nth-child(5){ animation-delay:0.15s; }
  .visualizer span:nth-child(6){ animation-delay:0.35s; }
  .visualizer span:nth-child(7){ animation-delay:0.05s; }
  .visualizer span:nth-child(8){ animation-delay:0.25s; }
  @keyframes bounce{
    0%,100%{ height:6px; } 50%{ height:32px; }
  }

  .now-playing-info{ display:flex; flex-direction:column; justify-content:center; }
  .np-top-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .np-eyebrow{ font-family:'Space Mono', monospace; font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin-bottom:14px; }
  .np-title-row{ display:flex; align-items:center; gap:14px; }
  .np-title{ font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic; font-size:clamp(2rem, 4vw, 3rem); line-height:1.1; }
  .np-artist{ color:var(--muted); font-size:1.05rem; margin-top:8px; }
  .np-favbtn{
    background:none; border:none; color:var(--muted); cursor:pointer; flex-shrink:0;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    transition:color .2s ease, transform .15s ease;
  }
  .np-favbtn:hover{ transform:scale(1.1); }
  .np-favbtn svg{ width:20px; height:20px; }
  .np-favbtn.active{ color:var(--rose); }

  .up-next{ font-family:'Space Mono', monospace; font-size:0.72rem; color:var(--muted); margin-top:14px; }
  .up-next b{ color:var(--ink); font-weight:500; }

  .progress-row{ margin-top:22px; }
  .progress-track{
    position:relative; height:5px; border-radius:99px; background:var(--surface-2); cursor:pointer;
  }
  .progress-fill{
    position:absolute; left:0; top:0; height:100%; border-radius:99px;
    background:linear-gradient(90deg, var(--gold), var(--rose)); width:0%;
  }
  .progress-handle{
    position:absolute; top:50%; width:13px; height:13px; border-radius:50%;
    background:var(--ink); transform:translate(-50%, -50%); left:0%;
    box-shadow:0 0 0 4px rgba(232,195,104,0.18);
  }
  .time-row{ display:flex; justify-content:space-between; margin-top:10px; font-family:'Space Mono', monospace; font-size:0.75rem; color:var(--muted); }

  .controls-row{ display:flex; align-items:center; justify-content:center; gap:22px; margin-top:32px; }
  @media (max-width:900px){ .controls-row{ justify-content:flex-start; } }
  .ctrl-btn{
    background:none; border:none; color:var(--muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:50%; transition:color .2s ease, background .2s ease;
  }
  .ctrl-btn:hover{ color:var(--ink); background:var(--surface); }
  .ctrl-btn.active{ color:var(--gold); }
  .ctrl-btn svg{ width:19px; height:19px; }
  .play-btn{
    width:60px; height:60px; border-radius:50%;
    background:linear-gradient(135deg, var(--gold), var(--rose));
    color:var(--bg); display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease;
  }
  .play-btn:hover{ transform:scale(1.06); box-shadow:0 14px 34px -10px rgba(232,195,104,0.5); }
  .play-btn svg{ width:22px; height:22px; }

  .volume-row{ display:flex; align-items:center; gap:12px; margin-top:30px; max-width:200px; }
  .vol-btn{ background:none; border:none; color:var(--muted); cursor:pointer; display:flex; align-items:center; padding:0; flex-shrink:0; transition:color .2s ease; }
  .vol-btn:hover{ color:var(--ink); }
  .vol-btn svg{ width:16px; height:16px; }
  input[type="range"].volume-slider{
    -webkit-appearance:none; appearance:none; width:100%; height:3px;
    background:var(--surface-2); border-radius:99px; outline:none;
  }
  input[type="range"].volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--gold); cursor:pointer;
  }
  input[type="range"].volume-slider::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%; background:var(--gold); border:none; cursor:pointer;
  }

  /* ===================== PLAYLIST TABS ===================== */
  .playlist-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:24px; }
  h2.section-title{ font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic; font-size:1.7rem; }
  .head-right{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .search-wrap{ position:relative; }
  .search-input{
    background:var(--surface); border:1px solid var(--hairline); color:var(--ink);
    font-family:'Sora', sans-serif; font-size:0.82rem; padding:9px 14px 9px 34px;
    border-radius:999px; width:190px; transition:border-color .2s ease, width .2s ease;
  }
  .search-input::placeholder{ color:var(--muted); }
  .search-input:focus{ border-color:var(--gold); width:220px; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted); pointer-events:none; }
  .mood-tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .mood-tab{
    padding:9px 18px; border-radius:999px; border:1px solid var(--hairline);
    background:transparent; color:var(--muted); font-size:0.82rem; cursor:pointer;
    transition:all .2s ease; display:flex; align-items:center; gap:6px;
  }
  .mood-tab:hover{ border-color:var(--gold); color:var(--ink); }
  .mood-tab.active{ background:var(--surface); border-color:var(--gold); color:var(--gold); }
  .mood-tab svg{ width:12px; height:12px; }

  /* ===================== TRACK LIST ===================== */
  .track-list{ display:flex; flex-direction:column; }
  .empty-state{ padding:40px 16px; text-align:center; color:var(--muted); font-size:0.9rem; }
  .track-row{
    display:grid; grid-template-columns:32px 1fr auto auto auto; align-items:center; gap:18px;
    padding:14px 16px; border-radius:12px; cursor:pointer;
    transition:background .2s ease;
  }
  .track-row:hover{ background:var(--surface); }
  .track-row.playing{ background:var(--surface-2); }
  .track-num{ font-family:'Space Mono', monospace; font-size:0.8rem; color:var(--muted); text-align:center; }
  .track-row.playing .track-num{ color:var(--gold); }
  .track-info .t-title{ font-size:0.98rem; font-weight:500; }
  .track-row.playing .track-info .t-title{ color:var(--gold); }
  .track-info .t-artist{ font-size:0.82rem; color:var(--muted); margin-top:2px; }
  .track-dur{ font-family:'Space Mono', monospace; font-size:0.78rem; color:var(--muted); }
  .fav-toggle{
    background:none; border:none; color:var(--muted); cursor:pointer; opacity:0;
    display:flex; align-items:center; justify-content:center; width:26px; height:26px;
    transition:opacity .2s ease, color .2s ease, transform .15s ease;
  }
  .track-row:hover .fav-toggle, .fav-toggle.active{ opacity:1; }
  .fav-toggle:hover{ transform:scale(1.12); }
  .fav-toggle.active{ color:var(--rose); }
  .fav-toggle svg{ width:14px; height:14px; }
  .track-playicon{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:var(--muted); opacity:0; transition:opacity .2s ease;
  }
  .track-row:hover .track-playicon{ opacity:1; }
  .track-row.playing .track-playicon{ opacity:1; color:var(--gold); }
  .track-playicon svg{ width:14px; height:14px; }

  footer{ border-top:1px solid var(--hairline); padding:32px 0; text-align:center; color:var(--muted); font-size:0.82rem; margin-top:60px; }

  /* ===================== TOAST ===================== */
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px);
    background:var(--surface-2); border:1px solid var(--hairline); color:var(--ink);
    padding:12px 20px; border-radius:10px; font-size:0.82rem; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:50; max-width:90vw;
    box-shadow:0 20px 40px -10px rgba(0,0,0,0.5);
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="#" class="logo">Noc<span>turne</span></a>
    <div class="navlinks">
      <a href="#">Playlists</a>
      <a href="#">Library</a>
      <a href="#">About</a>
    </div>
  </div>
</nav>

<main>
  <div class="wrap">

    <section class="player">
      <div class="art-stage">
        <div class="art-glow" id="artGlow"></div>
        <div class="buffer-ring" id="bufferRing"></div>
        <div class="disc" id="disc">
          <div class="disc-center" id="discInitials">N</div>
        </div>
        <div class="visualizer" id="visualizer">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="now-playing-info">
        <span class="np-eyebrow" id="npPlaylist">Now Playing — Late Night</span>
        <div class="np-title-row">
          <h1 class="np-title" id="npTitle">Loading…</h1>
          <button class="np-favbtn" id="npFavBtn" aria-label="Add to favorites" title="Favorite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
          </button>
        </div>
        <p class="np-artist" id="npArtist"></p>

        <div class="progress-row">
          <div class="progress-track" id="progressTrack" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-handle" id="progressHandle"></div>
          </div>
          <div class="time-row">
            <span id="timeCurrent">0:00</span>
            <span id="timeDuration">0:00</span>
          </div>
        </div>

        <div class="controls-row">
          <button class="ctrl-btn" id="shuffleBtn" aria-label="Shuffle" title="Shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button class="ctrl-btn" id="prevBtn" aria-label="Previous track">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12L18 6v12z"/></svg>
          </button>
          <button class="play-btn" id="playBtn" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="nextBtn" aria-label="Next track">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
          </button>
          <button class="ctrl-btn" id="repeatBtn" aria-label="Repeat" title="Repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>
          </button>
        </div>

        <p class="up-next" id="upNext"></p>

        <div class="volume-row">
          <button class="vol-btn" id="volBtn" aria-label="Mute">
            <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zM16.5 12a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
          </button>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" aria-label="Volume">
        </div>
      </div>
    </section>

<br>
<section><div><h6>audio is placeholder/demo data</h6> </div></section>

<br>
    <section>
      <div class="playlist-head">
        <h2 class="section-title">The Queue</h2>
        <div class="head-right">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Search title or artist…">
          </div>
          <div class="mood-tabs" id="moodTabs"></div>
        </div>
      </div>
      <div class="track-list" id="trackList"></div>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">© 2026 Nocturne. Streaming audio for demonstration purposes.</div>
</footer>

<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="ariaLive" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);"></div>

<script>
  // ===================== DATA =====================
  const playlists = {
    latenight: {
      label: 'Late Night',
      tracks: [
        { title:'After Hours Glow', artist:'Wren & Co.', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
        { title:'Neon Static',      artist:'Halide',      src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
        { title:'Velvet Skyline',   artist:'Ochre Room',  src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
        { title:'3 AM Thoughts',    artist:'Nightcall Society', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
        { title:'Slow Burn',        artist:'Faded Signal', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' }
      ]
    },
    focus: {
      label: 'Focus',
      tracks: [
        { title:'Quiet Momentum',  artist:'Glass Antlers', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3' },
        { title:'Glass Corridor',  artist:'Loom',          src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3' },
        { title:'Steady State',    artist:'Paper Moons',   src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3' },
        { title:'Paper Trails',    artist:'Drift Theory',  src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3' },
        { title:'Clear Signal',    artist:'Halide',        src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3' }
      ]
    },
    energy: {
      label: 'Energy',
      tracks: [
        { title:'Pulse Drive',     artist:'Static Bloom',  src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3' },
        { title:'Overdrive',       artist:'Ochre Room',    src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3' },
        { title:'Electric Bloom',  artist:'Wren & Co.',    src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-13.mp3' },
        { title:'Rising Tide',     artist:'Nightcall Society', src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-14.mp3' }
      ]
    },
    chill: {
      label: 'Chill',
      tracks: [
        { title:'Sunday Static',   artist:'Faded Signal',  src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3' },
        { title:'Soft Landing',    artist:'Paper Moons',   src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-16.mp3' },
        { title:'Low Tide',        artist:'Loom',          src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
        { title:'Warm Static',     artist:'Drift Theory',  src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' }
      ]
    }
  };

  // Flatten into a single addressable list, tagging each with its playlist key
  const allTracks = [];
  Object.entries(playlists).forEach(([key, pl]) => {
    pl.tracks.forEach(t => allTracks.push({ ...t, playlistKey: key, playlistLabel: pl.label, duration: null }));
  });

  // Distinct gradient per track for the disc + glow, generated from index (no external art files needed)
  const gradients = [
    ['#E8C368','#E0806B'], ['#7C9EDB','#E8C368'], ['#6FBF9E','#E0806B'],
    ['#C97BDB','#7C9EDB'], ['#E8C368','#6FBF9E'], ['#E0806B','#C97BDB'],
    ['#7C9EDB','#6FBF9E'], ['#E8C368','#C97BDB']
  ];
  function gradientFor(idx){ return gradients[idx % gradients.length]; }

  // ===================== STATE =====================
  let currentFilter = 'all';       // 'all' | playlist key | 'favorites'
  let searchQuery = '';
  let currentTrackIndex = 0;
  let isPlaying = false;
  let shuffleOn = false;
  let repeatMode = 'off'; // off | all | one
  let lastVolume = 0.7;
  const favorites = new Set();

  const audio = document.getElementById('audio');

  // ===================== DOM REFS =====================
  const discEl = document.getElementById('disc');
  const discInitials = document.getElementById('discInitials');
  const artGlow = document.getElementById('artGlow');
  const bufferRing = document.getElementById('bufferRing');
  const visualizer = document.getElementById('visualizer');
  const npPlaylist = document.getElementById('npPlaylist');
  const npTitle = document.getElementById('npTitle');
  const npArtist = document.getElementById('npArtist');
  const npFavBtn = document.getElementById('npFavBtn');
  const upNext = document.getElementById('upNext');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const progressHandle = document.getElementById('progressHandle');
  const timeCurrent = document.getElementById('timeCurrent');
  const timeDuration = document.getElementById('timeDuration');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const volBtn = document.getElementById('volBtn');
  const volIcon = document.getElementById('volIcon');
  const moodTabs = document.getElementById('moodTabs');
  const searchInput = document.getElementById('searchInput');
  const trackList = document.getElementById('trackList');
  const toast = document.getElementById('toast');
  const ariaLive = document.getElementById('ariaLive');

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const ICON_HEART_OUTLINE = '<path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/>';
  const ICON_HEART_FILLED = '<path fill="currentColor" stroke="none" d="M12 21S3 14.6 3 8.9A5.4 5.4 0 0112 5.6a5.4 5.4 0 019 3.3C21 14.6 12 21 12 21z"/>';
  const ICON_VOL_HIGH = '<path d="M3 9v6h4l5 5V4L7 9H3zM16.5 12a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/>';
  const ICON_VOL_LOW = '<path d="M3 9v6h4l5 5V4L7 9H3z"/>';
  const ICON_VOL_MUTE = '<path d="M3 9v6h4l5 5V4L7 9H3zM19 9l-4 4m0-4l4 4"/>';

  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    ariaLive.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ===================== BUILD TABS =====================
  function buildTabs(){
    const specs = [{ key:'all', label:'All' }, ...Object.entries(playlists).map(([key, pl]) => ({ key, label: pl.label }))];
    specs.forEach(spec => {
      const tab = document.createElement('button');
      tab.className = 'mood-tab' + (spec.key === 'all' ? ' active' : '');
      tab.textContent = spec.label;
      tab.dataset.filter = spec.key;
      tab.addEventListener('click', () => setFilter(spec.key, tab));
      moodTabs.appendChild(tab);
    });

    const favTab = document.createElement('button');
    favTab.className = 'mood-tab';
    favTab.dataset.filter = 'favorites';
    favTab.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICON_HEART_OUTLINE}</svg> Favorites`;
    favTab.addEventListener('click', () => setFilter('favorites', favTab));
    moodTabs.appendChild(favTab);
  }

  function setFilter(filter, tabEl){
    currentFilter = filter;
    document.querySelectorAll('.mood-tab').forEach(t => t.classList.remove('active'));
    tabEl.classList.add('active');
    renderTrackList();
  }

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    renderTrackList();
  });

  // ===================== BUILD TRACK LIST =====================
  function matchesFilter(t, idx){
    if (currentFilter === 'favorites') return favorites.has(idx);
    if (currentFilter !== 'all' && t.playlistKey !== currentFilter) return false;
    if (searchQuery){
      const hay = (t.title + ' ' + t.artist).toLowerCase();
      if (!hay.includes(searchQuery)) return false;
    }
    return true;
  }

  function visibleTrackIndices(){
    return allTracks.map((t, i) => i).filter(i => matchesFilter(allTracks[i], i));
  }

  function renderTrackList(){
    trackList.innerHTML = '';
    const indices = visibleTrackIndices();

    if (indices.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = currentFilter === 'favorites'
        ? 'No favorites yet — tap the heart on a track to save it here.'
        : 'No tracks match your search.';
      trackList.appendChild(empty);
      updateNpFav();
      updateUpNext();
      return;
    }

    indices.forEach((idx, pos) => {
      const t = allTracks[idx];
      const isFav = favorites.has(idx);
      const row = document.createElement('div');
      row.className = 'track-row' + (idx === currentTrackIndex ? ' playing' : '');
      row.dataset.index = idx;
      row.innerHTML = `
        <div class="track-num">${idx === currentTrackIndex && isPlaying ? '♪' : pos + 1}</div>
        <div class="track-info">
          <div class="t-title">${escapeHtml(t.title)}</div>
          <div class="t-artist">${escapeHtml(t.artist)} · ${escapeHtml(t.playlistLabel)}</div>
        </div>
        <div class="track-dur" data-dur-for="${idx}">${t.duration ? formatTime(t.duration) : '--:--'}</div>
        <button class="fav-toggle${isFav ? ' active' : ''}" data-fav-idx="${idx}" aria-label="${isFav ? 'Remove from favorites' : 'Add to favorites'}" title="Favorite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${isFav ? ICON_HEART_FILLED : ICON_HEART_OUTLINE}</svg>
        </button>
        <div class="track-playicon"><svg viewBox="0 0 24 24" fill="currentColor">${idx === currentTrackIndex && isPlaying ? ICON_PAUSE : ICON_PLAY}</svg></div>
      `;
      row.addEventListener('click', (e) => {
        if (e.target.closest('.fav-toggle')) return;
        loadTrack(idx, true);
      });
      row.querySelector('.fav-toggle').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavorite(idx);
      });
      trackList.appendChild(row);
    });

    updateNpFav();
    updateUpNext();
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function toggleFavorite(idx){
    if (favorites.has(idx)){ favorites.delete(idx); }
    else { favorites.add(idx); }
    renderTrackList();
  }

  npFavBtn.addEventListener('click', () => toggleFavorite(currentTrackIndex));

  function updateNpFav(){
    const isFav = favorites.has(currentTrackIndex);
    npFavBtn.classList.toggle('active', isFav);
    npFavBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${isFav ? ICON_HEART_FILLED : ICON_HEART_OUTLINE}</svg>`;
    npFavBtn.setAttribute('aria-label', isFav ? 'Remove from favorites' : 'Add to favorites');
  }

  function updateUpNext(){
    const indices = visibleTrackIndices();
    if (indices.length < 2){ upNext.textContent = ''; return; }
    const nIdx = nextIndex();
    if (nIdx === currentTrackIndex){ upNext.textContent = ''; return; }
    const t = allTracks[nIdx];
    upNext.innerHTML = `Up next — <b>${escapeHtml(t.title)}</b> · ${escapeHtml(t.artist)}`;
  }

  // ===================== DURATION PRELOADING =====================
  // Quietly probes metadata for every track in the background so the queue
  // shows real durations instead of "--:--" without blocking playback.
  function preloadDurations(){
    let i = 0;
    function loadNext(){
      if (i >= allTracks.length) return;
      const idx = i++;
      const t = allTracks[idx];
      if (t.duration != null){ loadNext(); return; }
      const probe = new Audio();
      probe.preload = 'metadata';
      probe.src = t.src;
      probe.addEventListener('loadedmetadata', () => {
        t.duration = probe.duration;
        const cell = document.querySelector(`[data-dur-for="${idx}"]`);
        if (cell) cell.textContent = formatTime(t.duration);
        loadNext();
      });
      probe.addEventListener('error', loadNext);
    }
    // Stagger a few probes concurrently rather than one giant burst.
    for (let c = 0; c < 3; c++) loadNext();
  }

  // ===================== TRACK LOADING =====================
  function loadTrack(idx, autoplay){
    currentTrackIndex = idx;
    const t = allTracks[idx];
    audio.src = t.src;

    npPlaylist.textContent = `Now Playing — ${t.playlistLabel}`;
    npTitle.textContent = t.title;
    npArtist.textContent = t.artist;
    discInitials.textContent = t.artist.charAt(0);

    const [c1, c2] = gradientFor(idx);
    discEl.style.background = `conic-gradient(from 180deg, ${c1}, ${c2}, ${c1})`;
    artGlow.style.background = `radial-gradient(circle, ${c1}, ${c2})`;

    progressFill.style.width = '0%';
    progressHandle.style.left = '0%';
    progressTrack.setAttribute('aria-valuenow', '0');
    timeCurrent.textContent = '0:00';
    timeDuration.textContent = t.duration ? formatTime(t.duration) : '0:00';

    updateMediaSession(t);
    renderTrackList();

    if (autoplay){
      audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
    }
  }

  // ===================== PLAY / PAUSE =====================
  function setPlaying(playing){
    isPlaying = playing;
    playIcon.outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${playing ? ICON_PAUSE : ICON_PLAY}</svg>`;
    discEl.classList.toggle('spinning', playing);
    visualizer.classList.toggle('playing', playing);
    if ('mediaSession' in navigator){
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
    }
    renderTrackList();
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    if (isPlaying){
      audio.pause();
      setPlaying(false);
    } else {
      audio.play().then(() => setPlaying(true)).catch(() => {});
    }
  });

  // ===================== NEXT / PREV / SHUFFLE / REPEAT =====================
  function nextIndex(){
    const indices = visibleTrackIndices();
    if (indices.length === 0) return currentTrackIndex;
    if (shuffleOn){
      let pick = indices[Math.floor(Math.random() * indices.length)];
      if (indices.length > 1){
        while (pick === currentTrackIndex){ pick = indices[Math.floor(Math.random() * indices.length)]; }
      }
      return pick;
    }
    let pos = indices.indexOf(currentTrackIndex);
    if (pos === -1) pos = 0;
    return indices[(pos + 1) % indices.length];
  }

  function prevIndex(){
    const indices = visibleTrackIndices();
    if (indices.length === 0) return currentTrackIndex;
    let pos = indices.indexOf(currentTrackIndex);
    if (pos === -1) pos = 0;
    return indices[(pos - 1 + indices.length) % indices.length];
  }

  nextBtn.addEventListener('click', () => loadTrack(nextIndex(), true));
  prevBtn.addEventListener('click', () => {
    if (audio.currentTime > 3){ audio.currentTime = 0; return; }
    loadTrack(prevIndex(), true);
  });

  shuffleBtn.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    shuffleBtn.classList.toggle('active', shuffleOn);
    updateUpNext();
  });

  repeatBtn.addEventListener('click', () => {
    repeatMode = repeatMode === 'off' ? 'all' : repeatMode === 'all' ? 'one' : 'off';
    repeatBtn.classList.toggle('active', repeatMode !== 'off');
    repeatBtn.title = repeatMode === 'off' ? 'Repeat' : repeatMode === 'all' ? 'Repeat: All' : 'Repeat: One';
  });

  audio.addEventListener('ended', () => {
    if (repeatMode === 'one'){
      audio.currentTime = 0;
      audio.play();
      return;
    }
    const indices = visibleTrackIndices();
    const pos = indices.indexOf(currentTrackIndex);
    const isLast = pos === indices.length - 1;
    if (isLast && repeatMode === 'off' && !shuffleOn){
      setPlaying(false);
      return;
    }
    loadTrack(nextIndex(), true);
  });

  // Autoplay-next also on error, so a broken track doesn't stall the queue.
  audio.addEventListener('error', () => {
    if (!audio.src) return;
    showToast(`Couldn't play "${allTracks[currentTrackIndex].title}" — skipping.`);
    const indices = visibleTrackIndices();
    if (indices.length > 1){
      loadTrack(nextIndex(), true);
    } else {
      setPlaying(false);
    }
  });

  // Buffering indicator
  audio.addEventListener('waiting', () => bufferRing.classList.add('active'));
  audio.addEventListener('playing', () => bufferRing.classList.remove('active'));
  audio.addEventListener('canplay', () => bufferRing.classList.remove('active'));

  // ===================== PROGRESS =====================
  function formatTime(sec){
    if (!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  audio.addEventListener('loadedmetadata', () => {
    timeDuration.textContent = formatTime(audio.duration);
    allTracks[currentTrackIndex].duration = audio.duration;
    const durEl = document.querySelector(`[data-dur-for="${currentTrackIndex}"]`);
    if (durEl) durEl.textContent = formatTime(audio.duration);
    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession){
      try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: 1, position: 0 }); } catch(e){}
    }
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    progressHandle.style.left = pct + '%';
    progressTrack.setAttribute('aria-valuenow', Math.round(pct));
    timeCurrent.textContent = formatTime(audio.currentTime);
  });

  let seeking = false;
  function seekFromEvent(e){
    const rect = progressTrack.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    progressFill.style.width = (pct * 100) + '%';
    progressHandle.style.left = (pct * 100) + '%';
    progressTrack.setAttribute('aria-valuenow', Math.round(pct * 100));
    if (audio.duration){ audio.currentTime = pct * audio.duration; }
  }
  progressTrack.addEventListener('mousedown', (e) => { seeking = true; seekFromEvent(e); });
  window.addEventListener('mousemove', (e) => { if (seeking) seekFromEvent(e); });
  window.addEventListener('mouseup', () => { seeking = false; });
  progressTrack.addEventListener('touchstart', (e) => { seeking = true; seekFromEvent(e); });
  window.addEventListener('touchmove', (e) => { if (seeking) seekFromEvent(e); });
  window.addEventListener('touchend', () => { seeking = false; });

  // Keyboard-accessible seeking when the progress bar itself is focused
  progressTrack.addEventListener('keydown', (e) => {
    if (!audio.duration) return;
    const step = 5; // seconds
    if (e.key === 'ArrowRight'){ audio.currentTime = Math.min(audio.duration, audio.currentTime + step); e.preventDefault(); }
    if (e.key === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime - step); e.preventDefault(); }
  });

  // ===================== VOLUME =====================
  audio.volume = 0.7;
  function updateVolIcon(){
    const v = audio.volume;
    const icon = audio.muted || v === 0 ? ICON_VOL_MUTE : v < 0.5 ? ICON_VOL_LOW : ICON_VOL_HIGH;
    volIcon.outerHTML = `<svg id="volIcon" viewBox="0 0 24 24" fill="currentColor">${icon}</svg>`;
    volBtn.setAttribute('aria-label', audio.muted || v === 0 ? 'Unmute' : 'Mute');
  }
  volumeSlider.addEventListener('input', () => {
    audio.volume = volumeSlider.value / 100;
    audio.muted = false;
    if (audio.volume > 0) lastVolume = audio.volume;
    updateVolIcon();
  });
  volBtn.addEventListener('click', () => {
    if (audio.muted || audio.volume === 0){
      audio.muted = false;
      audio.volume = lastVolume || 0.7;
      volumeSlider.value = Math.round(audio.volume * 100);
    } else {
      lastVolume = audio.volume;
      audio.muted = true;
    }
    updateVolIcon();
  });
  updateVolIcon();

  // ===================== MEDIA SESSION (lock screen / hardware keys) =====================
  function updateMediaSession(t){
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title,
      artist: t.artist,
      album: 'Nocturne — ' + t.playlistLabel
    });
    navigator.mediaSession.setActionHandler('play', () => { audio.play().then(() => setPlaying(true)).catch(()=>{}); });
    navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); setPlaying(false); });
    navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
    navigator.mediaSession.setActionHandler('seekto', (details) => {
      if (details.seekTime != null && audio.duration){ audio.currentTime = details.seekTime; }
    });
  }

  // ===================== KEYBOARD SHORTCUTS =====================
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.target === progressTrack) return; // handled above
    if (e.code === 'Space'){ e.preventDefault(); playBtn.click(); }
    if (e.code === 'ArrowRight'){ nextBtn.click(); }
    if (e.code === 'ArrowLeft'){ prevBtn.click(); }
    if (e.code === 'ArrowUp'){ e.preventDefault(); volumeSlider.value = Math.min(100, +volumeSlider.value + 5); volumeSlider.dispatchEvent(new Event('input')); }
    if (e.code === 'ArrowDown'){ e.preventDefault(); volumeSlider.value = Math.max(0, +volumeSlider.value - 5); volumeSlider.dispatchEvent(new Event('input')); }
    if (e.key === 'm' || e.key === 'M'){ volBtn.click(); }
  });

  // ===================== INIT =====================
  buildTabs();
  loadTrack(0, false);
  preloadDurations();
</script>

</body>
</html>
